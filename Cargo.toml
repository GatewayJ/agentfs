[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"
exclude = ["vendor/winfsp_wrs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["gatewayJ <835269233@qq.com>"]
license = "Apache-2.0"

[workspace.dependencies]
agentfs-model = { path = "crates/agentfs-model" }
agentfs-ports = { path = "crates/agentfs-ports" }
agentfs-engine = { path = "crates/agentfs-engine" }
agentfs-local = { path = "crates/agentfs-local" }
agentfs-s3 = { path = "crates/agentfs-s3" }
agentfs-platform = { path = "crates/agentfs-platform" }
agentfs-mcp = { path = "crates/agentfs-mcp" }
agentfs-test-support = { path = "crates/agentfs-test-support" }
async-trait = "0.1.89"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
libc = "0.2"
object_store = { version = "0.14.2", features = ["aws"] }
parking_lot = "0.12"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["uuid1"] }
rmcp = { version = "3.5.1", features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest"] }
axum = "0.8"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-casefold = "0.2"
unicode-normalization = "0.1.25"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"


[patch.crates-io]
winfsp_wrs = { path = "vendor/winfsp_wrs" }
